#:schema node_modules/wrangler/config-schema.json
# =============================================================================
# CONFIGURACION DE LA API (Cloudflare Worker)
# =============================================================================

# -----------------------------------------------------------------------------
# Identidad del Worker
# -----------------------------------------------------------------------------
#
# EL NOMBRE ES LA URL. Cloudflare publica este Worker en
# `qbaswing-api.workers.dev`, y esa direccion es la que va en el panel de
# QvaPay como URL de notificacion. Renombrar el Worker cambia la URL y obliga a
# corregir el panel de la pasarela, asi que el nombre no se toca nunca mas.
#
# EL DOMINIO ES GRATUITO Y ES SUFICIENTE. No hace falta comprar un dominio para
# cobrar: lo que QvaPay y TropiPay necesitan es una direccion HTTPS que
# responda en el webhook, y `workers.dev` lo es, con TLS valido y sin tarjeta.
#
# `main` apunta al entrypoint. Sin esto Wrangler busca `src/index.ts`, que no
# existe, y el despliegue falla con un mensaje que no menciona `main`.
# -----------------------------------------------------------------------------
name = "qbaswing-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
# `nodejs_compat` habilita `node:crypto`. Sin el, el HMAC-SHA256 de los enlaces de
# descarga no se puede calcular en el Worker y habria que implementarlo a mano.
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# Este es el backend del marketplace. Vive aparte de `wrangler.toml` porque es
# otro despliegue: `wrangler deploy -c wrangler.api.toml`.
#
# -----------------------------------------------------------------------------
# QUE VIVE ACA Y QUE NO
# -----------------------------------------------------------------------------
#
#   ESTA PAGINA PUBLICA (wrangler.toml)
#     Sirve HTML estatico. Sin Node, sin base, sin secretos. La cachea el CDN.
#     Solo hace fetch a la API desde el navegador del visitante.
#
#   ESTA API (aca)
#     Todo lo que necesita una credencial:
#       - verificar que quien descarga compro
#       - firmar y validar los enlaces de descarga
#       - validar la firma de los webhooks de QvaPay y TropiPay
#       - leer y escribir en D1
#       - guardar y sacar archivos de KV
#
# -----------------------------------------------------------------------------
# POR QUE NO SE SIRVE LA API DESDE PAGES
# -----------------------------------------------------------------------------
# Pages puede ejecutar funciones, pero solo con Pages Functions y sin acceso a
# las variables de entorno del proyecto de la misma forma. Un Worker separado da
# una URL distinta (`workers.dev`), unos limites distintos y un despliegue
# distinto: cambiar la API no toca el sitio.
#
# Tambien evita el acoplamiento: el sitio puede seguir publicandose aunque la
# API este caida. El visitante ve la pagina y un aviso de que no se pudo cargar
# el catalogo, en vez de una pantalla en blanco.
#
# -----------------------------------------------------------------------------
# D1
# -----------------------------------------------------------------------------
# El binding se llama `DB` y no `database_id` porque asi lo pide el codigo:
# `env.DB.prepare(...)`. El nombre del binding es parte de la API del Worker; si
# cambia, hay que cambiarlo en el codigo tambien, y por eso queda declarado en
# un solo lugar.
#
d1_databases = [
  { binding = "DB", database_name = "qbaswing_marketplace", database_id = "636aa765-631e-494f-a6f1-7e9a545bd583" },
]

# -----------------------------------------------------------------------------
# Workers KV: los archivos de los productos
# -----------------------------------------------------------------------------
#
# POR QUE KV Y NO R2, Y POR QUE NO D1
#
#   D1  -> tope de 2 MB por fila. Un ZIP de 50 MB no entra. Ademas el tope no
#          sube con plan pagado: es absoluto.
#   KV  -> 25 MiB por valor, 1 GB en total en el plan gratis, SIN tarjeta. Es lo
#          que alcanza para arrancar.
#   R2  -> sin limite por archivo, 10 GB gratis, PERO exige metodo de pago.
#          Como no hay tarjeta bancaria, R2 queda descartado por ahora.
#
# El binding es `ARCHIVOS` y no `KV` a proposito: dentro de un mes, cuando haya
# tarjeta, se cambia esta linea a `r2_buckets` y el codigo no cambia, porque
# todo el acceso pasa por `src/lib/almacenamiento.ts`.
#
# El namespace se creo con:
#   npx wrangler kv namespace create ARCHIVOS
# El id esta pegado abajo. Es publico (no es una credencial) y por eso el archivo
# si se versiona: el binding tiene que viajar al CI para que un despliegue
# automatico encuentre el mismo namespace y no uno nuevo vacio.
#
kv_namespaces = [
  { binding = "ARCHIVOS", id = "d17446bd79644534baad1a185830ad6e" }
]
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Migraciones
# -----------------------------------------------------------------------------
# D1 busca las migraciones en `migrations/` y NO hay forma de cambiarlo desde
# el `.toml`: Wrangler rechaza `migrations_dir` como campo de nivel superior
# ("Unexpected fields found in top-level field"). Se intento y el error lo dice.
#
# Consecuencia: el directorio tiene que llamarse `migrations/`. Por eso el
# esquema se llama `0001_esquema_inicial.sql` y no `schema.sql`: el nombre dice
# lo que es, y al ir en la carpeta de migraciones Wrangler lo aplica en orden.
#
# Hay UN archivo por version, y cada uno se aplica una sola vez. No se copia el
# esquema a otra carpeta: dos archivos identicos divergen sin aviso, uno se
# editaba y el otro se quedaba atras, y el fallo aparecia en produccion y no en el
# editor. Para ver el estado actual se lee el ultimo archivo aplicado.
#
# NUNCA aplicar el esquema con `wrangler d1 execute --command ".read ..."` en
# produccion: no deja registro de que se aplico, asi que no hay forma de saber
# si la proxima corrida debe hacerlo o no. Y con `--remote` explicito, que es lo
# que importa: sin el, Wrangler aplica en la base LOCAL y uno cree que esta en
# produccion.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Variables NO secretas
# -----------------------------------------------------------------------------
# Se pueden ver en el panel y en el bundle. Solo lo que no es credencial.
[vars]
# Origenes permitidos del Worker, separados por coma. Sin esto, cualquiera podria
# llamar la API desde su pagina.
#
# `localhost` esta aqui porque el registro y el acceso usan `fetch` DESDE el
# navegador: la pagina es HTML estatico y no hay servidor que envie el
# formulario. El navegador ve `http://localhost:4321` como un origen DISTINTO de
# `https://qbaswing-marketplace.pages.dev`, asi que sin esta entrada entrar
# funciona en produccion y no en local. El puerto va escrito porque el origen
# incluye el puerto.
#
# `127.0.0.1` tambien, porque algunos navegadores resuelven localhost a esa
# direccion y entonces el origen cambia de nombre. Se permiten los dos en vez de
# dejar uno y que dependa de como lo trate cada uno.
ALLOWED_ORIGIN = "https://qbaswing-marketplace.pages.dev,http://localhost:4321,http://localhost:4322,http://127.0.0.1:4321"
# Vida del enlace de descarga, en segundos. Corta a proposito: el enlace no es
# una URL permanente del archivo, es un permiso temporal.
EXPIRACION_ENLACE_SEG = "300"
# Ventana de tolerancia del timestamp de los webhooks, en segundos.
VENTANA_TIMESTAMP_SEG = "300"

# -----------------------------------------------------------------------------
# SECRETOS: van FUERA de este archivo
# -----------------------------------------------------------------------------
# Estos NO se escriben aca. Se ponen con:
#
#   npx wrangler secret put QBASWING_SECRETO_FIRMA
#   npx wrangler secret put QVAPAY_APP_SECRET
#   npx wrangler secret put TROPIPAY_CLIENT_ID
#   npx wrangler secret put TROPIPAY_CLIENT_SECRET
#
# `secret put` abre un prompt que no hace eco de lo que se escribe, y lo guarda
# cifrado. Si se pusieran en `[vars]` quedarian en texto plano en este archivo y
# en el repositorio, y un `app-secret` filtrado permite crear facturas a nombre
# del marketplace.
#
# Los tokens de TropiPay ya estan creados en el panel de TropiPay; lo que falta
# es pegarlos aca con el comando de arriba. Cada uno va a `secret put` en
# cuanto exista este Worker desplegado.